# This is a Docker Compose file for local development of the Digital Growth Charts documentation.

services:

  mkdocs: # Digital Growth Charts Documentation
    build: .
    volumes:
      - .:/app
    ports:
      - 8001:8000 # MkDocs will be accessible at localhost:8001
    command: sh -c "mkdocs serve --dev-addr=0.0.0.0:8000 --config-file mkdocs.yml"
    restart: always