name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: "Tag to release, e.g. v2026.07.05"
        required: true
        type: string

permissions:
  contents: read

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes from changelog
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Extract notes between this tag and the previous one
          # For now, use a simple approach - can enhance with git-cliff later
          notes=$(git log --format="- %s" $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")..HEAD 2>/dev/null | head -20)

          if [ -z "$notes" ]; then
            notes="- Documentation release $TAG"
          fi

          {
            printf '## Changes in %s\n\n' "$TAG"
            printf '%s\n\n' "$notes"
            printf '%s\n' '---'
            printf '%s\n' '*This release was created automatically by the release workflow.*'
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG" --title "Documentation Release $TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --latest

  build-pdf:
    name: Build PDF Documentation
    runs-on: ubuntu-latest
    needs: github-release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build PDF
        env:
          ENABLE_PDF_EXPORT: true
        run: |
          # Build the full documentation PDF
          # This uses the mkdocs-with-pdf plugin
          zensical build --clean

          # Or use the dedicated PDF build script if available
          if [ -f "s/build-pdf" ]; then
            ./s/build-pdf
          fi

      - name: Upload PDF to Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          shopt -s nullglob
          files=(pdf/*.pdf docs/_assets/_pdfs/*.pdf site/_assets/_pdfs/safety-documentation.pdf)
          if (( ${#files[@]} == 0 )); then
            echo "No PDF files found to upload."
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}"
