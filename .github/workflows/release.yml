name: Release

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: "Tag to release, e.g. v2026.07.05"
        required: true
        type: string

jobs:
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # Permissions inherited from auto-tag.yml via workflow_call

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Generate release notes from changelog
        id: notes
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          # Extract notes between this tag and the previous one
          # For now, use a simple approach - can enhance with git-cliff later
          notes=$(git log --format="- %s" $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")..HEAD 2>/dev/null | head -20)

          if [ -z "$notes" ]; then
            notes="- Documentation release $tag"
          fi

          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$notes" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@01570a1f399634c31508b45e63156c03358519bb # v2.0.4
        with:
          name: "Documentation Release ${{ inputs.tag || github.ref_name }}"
          body: |
            ## Changes in ${{ inputs.tag || github.ref_name }}

            ${{ steps.notes.outputs.notes }}

            ---
            *This release was created automatically by the release workflow.*
          generate_release_notes: false
          make_latest: true
          prerelease: false

  build-pdf:
    name: Build PDF Documentation
    runs-on: ubuntu-latest
    needs: github-release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build PDF
        env:
          ENABLE_PDF_EXPORT: true
        run: |
          # Build the full documentation PDF
          # This uses the mkdocs-with-pdf plugin
          zensical build --clean

          # Or use the dedicated PDF build script if available
          if [ -f "s/build-pdf" ]; then
            ./s/build-pdf
          fi

      - name: Upload PDF to Release
        uses: softprops/action-gh-release@01570a1f399634c31508b45e63156c03358519bb # v2.0.4
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            pdf/*.pdf
            docs/_assets/_pdfs/*.pdf
          fail_on_unmatched_files: false
