name: Auto-tag on documentation release

# When a push to live contains a release commit (chore(release): or docs(release):),
# create and push the matching date-based tag (vYYYY.MM.DD), then invoke the
# release workflow to create the GitHub Release and build artifacts.
#
# We invoke release.yml via `workflow_call` rather than relying on the tag
# push to trigger it, because pushes via the default GITHUB_TOKEN do not
# trigger downstream workflows (anti-recursion safeguard). Manual tag pushes
# from a developer's terminal still trigger release.yml via its `push: tags`
# trigger; both paths converge on the same release pipeline.

on:
  push:
    branches: [live]

permissions:
  contents: read

jobs:
  tag:
    name: Detect release commit and create tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.extract.outputs.tag }}
      released: ${{ steps.extract.outputs.released }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Extract release tag from commit message
        id: extract
        run: |
          commit_msg=$(git log -1 --pretty=%B)

          # Match patterns like:
          #   docs(release): v2026.07.05 (minor)
          #   docs(release): v2026.07.05-a (patch) (a release)
          #   chore(release): v2026.07.05 (major)
          if echo "$commit_msg" | grep -qE '(docs|chore)\(release\): v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[a-j])?'; then
            tag=$(echo "$commit_msg" | grep -m1 -oE 'v[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[a-j])?')
            echo "Release commit detected: $tag"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release commit detected"
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.extract.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.extract.outputs.tag }}
        run: |
          # Check if tag already exists
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag $TAG already exists - skipping."
            exit 0
          fi

          tag_object=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
            -f tag="$TAG" \
            -f message="Documentation release $TAG" \
            -f object="$GITHUB_SHA" \
            -f type="commit" \
            --jq .sha)
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$tag_object"
          echo "Created tag: $TAG"

  release:
    # Run the release workflow to create GitHub Release and build PDF
    # Using workflow_call sidesteps the GITHUB_TOKEN anti-recursion rule
    needs: tag
    if: needs.tag.outputs.released == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.tag }}
